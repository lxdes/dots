################################
# Backend and performance settings
################################
backend = "glx";
vsync = true;

# Track only changed regions and let Picom pace frames normally.
use-damage = true;
unredir-if-possible = false;
dithered-present = false;
no-frame-pacing = false;

################################
# Detect settings
################################
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient = true;

################################
# Global defaults & Blur
################################
corner-radius = 2;
shadow = false;

# Blur strength was zero, so avoid running the blur pipeline at all.
blur-method = "none";
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

################################
# Animations
################################
animations = (
  # Close / hide
  {
    triggers = ["close", "hide"];

    opacity = {
      curve = "cubic-bezier(0.2, 0, 1, 0.8)";
      duration = 0.20;
      start = "window-raw-opacity-before";
      end = 0;
    };

    blur-opacity = "opacity";
    shadow-opacity = "opacity";
  },

  # Open / show
  {
    triggers = ["open", "show"];

    opacity = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = 0;
      end = "window-raw-opacity";
    };

    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";

    scale-x = {
      curve = "cubic-bezier(0.2, 0, 0, 1)";
      duration = 0.28;
      start = 0.94;
      end = 1;
    };

    scale-y = "scale-x";

    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
  }
);

################################
# Rules
################################
rules: (
  # Base default rule: opaque with no blur
  {
    blur-background = false;
    opacity = 1.0;
    corner-radius = 2;
  },

  # Disable animations completely on browser popups, menus, and utilities
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu' || window_type = 'utility' || window_type = 'tooltip' || class_g ?= 'Chromium' || class_g ?= 'Brave-browser' || class_g ?= 'firefox' || class_g ?= 'librewolf'";
    animations = (
      {
        triggers = ["open", "show"];
        opacity = 1;
        scale-x = 1;
        scale-y = 1;
        offset-x = 0;
        offset-y = 0;
      },
      {
        triggers = ["close", "hide"];
        opacity = 0;
      }
    );
  },

  # Keep unfocused windows opaque without invoking the blur pipeline.
  {
    match = "!focused && (window_type = 'normal' || window_type = 'dialog' || class_g = 'Alacritty' || class_g = 'st-256color' || class_g = 'kitty' || class_g = 'FloaTerm' || class_g = 'wezterm' || class_g = 'org.wezfurlong.wezterm' || class_g = 'bspwm-scratch' || class_g = 'Updating')";
    opacity = 1.0;
    blur-background = false;
  },

  # Force 100% opacity and disable blur when a window becomes focused
  {
    match = "focused";
    opacity = 1.0;
    blur-background = false;
  },

  # Tooltips
  {
    match = "window_type = 'tooltip'";
    opacity = 1.0;
    corner-radius = 0;
    blur-background = false;
  },

  # Docks
  {
    match = "window_type = 'dock'";
    corner-radius = 0;
    opacity = 1.0;
    blur-background = false;
  },

  # Menus / popups / utilities
  {
    match = "window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'popup' || window_type = 'popup_menu' || window_type = 'utility'";
    opacity = 1.0;
    corner-radius = 0;
    blur-background = false;
    shadow = false;
  },

  # Fullscreen
  {
    match = "fullscreen";
    corner-radius = 0;
    opacity = 1.0;
    blur-background = false;
  },

  # Exclude specific apps from shadows
  {
    match = "name = 'Notification' || class_g ?= 'Notify-osd' || class_g = 'Dunst' || "
            "class_g = 'Polybar' || class_g = 'Eww' || class_g = 'jgmenu' || "
            "class_g = 'bspwm-scratch' || class_g = 'Spotify' || class_g = 'retroarch' || "
            "class_g = 'firefox' || class_g = 'librewolf' || class_g = 'Rofi' || class_g = 'Screenkey' || "
            "class_g = 'mpv' || class_g = 'Viewnior'";
    shadow = false;
  },

  # Quickshell panel and native popup windows
  {
    match = "name = 'Launcher' || class_g ?= 'quickshell' || class_g ?= 'qs' || "
            "name = 'Wallpaper Viewer' || name = 'Settings' || "
            "name = 'Power Menu' || name = 'Screenshot' || name = 'Authentication required'";
    opacity = 1.0;
    blur-background = false;
    shadow = false;
    corner-radius = 0;
  },

  # GTK apps draw their own surfaces and shadows; avoid compositor boxes
  {
    match = "class_g = 'slop' || _GTK_FRAME_EXTENTS@";
    blur-background = false;
    shadow = false;
    corner-radius = 0;
  },

  # GTK context menus and dropdowns
  {
    match = "class_g ?= 'Thunar'";
    opacity = 1.0;
    blur-background = false;
    shadow = false;
    corner-radius = 0;
  }
);
